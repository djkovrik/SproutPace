<!doctype html><html lang="ru"><meta charset="utf-8"><title>SproutPace — три палитры</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#e9e9e3;color:#18221b;font:16px system-ui}h1{margin:0 0 8px}p{line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:24px}article{background:white;padding:20px;border-radius:24px}h2{font-size:21px}.pair{display:grid;gap:14px}.sample{border-radius:20px;padding:22px;background:var(--bg);color:var(--fg)}.sample small{opacity:.8}.card{padding:16px;margin:16px 0;background:var(--card);border-radius:16px}.chip{display:inline-block;padding:7px 12px;border-radius:20px;background:var(--container);color:var(--oncontainer);font-size:13px}.button{padding:12px 16px;background:var(--primary);color:var(--onprimary);border-radius:24px;text-align:center;font-weight:600}.swatches{display:flex;gap:8px;margin-top:18px}.swatches i{width:32px;height:32px;border-radius:50%;background:var(--c);border:1px solid #8884}@media(max-width:950px){.grid{grid-template-columns:1fr}} </style>
<h1>SproutPace · цветовая схема</h1><p>Три направления на основе утверждённого лого 1Б-1. Ниже — образцы цветовых ролей, не редизайн экранов.</p><div class="grid" id="grid"></div>
<script>
const options=[
{name:'A · Лес и лайм',note:'Ближе всего к логотипу. Глубокий зелёный, свежий лайм и тёплый светлый фон.',light:['#FAF8F0','#18221B','#F0F1E8','#105C3B','#FFFFFF','#DCEFC3','#263D13'],dark:['#101710','#E1E6D9','#1C261D','#A5D66D','#173900','#304B20','#DCEFC3']},
{name:'B · Мягкий шалфей',note:'Более приглушённая гамма. Спокойные серо-зелёные поверхности и мягкие акценты.',light:['#F7F9F2','#1A231D','#EDF2E9','#35664C','#FFFFFF','#D7EAD7','#253C2A'],dark:['#131A15','#E0E7DD','#202B23','#A8D4B3','#133B25','#334D3A','#D7EAD7']},
{name:'C · Тёплая оранжерея',note:'Больше кремовых и оливковых тонов; зелёные действия на тёплых поверхностях.',light:['#FFF9ED','#24241A','#F6EFDD','#3F652A','#FFFFFF','#E7EDC1','#343E11'],dark:['#191B11','#E8E6D5','#292C1D','#BDD58C','#24360D','#424D27','#E7EDC1']}
];
for(const o of options){let a=document.createElement('article');a.innerHTML=`<h2>${o.name}</h2><p>${o.note}</p><div class="pair">${['light','dark'].map((mode)=>{let c=o[mode],names=['bg','fg','card','primary','onprimary','container','oncontainer'];return `<section class="sample" style="${names.map((n,i)=>`--${n}:${c[i]}`).join(';')}"><small>${mode==='light'?'Светлая тема':'Тёмная тема'}</small><h2>Сегодня</h2><span class="chip">3 активных лотка</span><div class="card"><b>Редис · день 5</b><p>Проверьте влажность субстрата</p><span style="color:var(--primary)">Открыть лоток →</span></div><div class="button">Новая партия</div><div class="swatches">${[c[3],c[5],c[2],c[0]].map(x=>`<i style="--c:${x}" title="${x}"></i>`).join('')}</div></section>`}).join('')}</div>`;document.querySelector('#grid').append(a)}
</script></html>
